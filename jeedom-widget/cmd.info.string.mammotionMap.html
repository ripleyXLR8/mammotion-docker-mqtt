<div class="cmd cmd-widget container-fluid #history#" data-type="info" data-subtype="string" data-template="mammotionMap" data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#" data-mapurl="#state#" style="padding:6px; min-width:120px;">
  <div class="title #hide_name#"><span class="cmdName">#name_display#</span></div>
  <div id="mammap#uid#" class="mammap-wrap" style="position:relative; width:100%; aspect-ratio:4/3; min-height:180px; background:#aad3df; border-radius:6px; overflow:hidden;"></div>
  <div style="margin-top:5px; text-align:center;">
    <a class="btn btn-default btn-sm mammap-pop" target="_blank" rel="noopener" href="#" title="Ouvrir la carte en plein &eacute;cran">Plein &eacute;cran</a>
  </div>
  <script>
  (function(){
    var uid = '#uid#';
    var wrap = document.getElementById('mammap' + uid);
    if (!wrap || wrap.dataset.mamInit) { return; }
    wrap.dataset.mamInit = '1';
    var root = wrap.closest('.cmd');

    function mapUrl(){
      var v = (root && root.getAttribute('data-mapurl')) || '';
      v = ('' + v).trim();
      if (/^https?:\/\//i.test(v)) { return v.replace(/\/+$/, ''); }
      return 'https://jeedom.perez-zadikian.fr/mammocam/map';
    }

    var f = document.createElement('iframe');
    f.src = mapUrl();
    f.setAttribute('scrolling', 'no');
    f.setAttribute('allow', 'fullscreen');
    f.setAttribute('allowfullscreen', '');
    f.style.cssText = 'position:absolute; inset:0; width:100%; height:100%; border:0; overflow:hidden;';
    wrap.appendChild(f);

    var pop = root.querySelector('.mammap-pop');
    if (pop) { pop.addEventListener('click', function(){ this.href = mapUrl(); }); }

    jeedom.cmd.update['#id#'] = function(_options){
      if (root && _options && typeof _options.display_value !== 'undefined' && _options.display_value !== '') {
        root.setAttribute('data-mapurl', _options.display_value);
      }
    };
  })();
  </script>
</div>
